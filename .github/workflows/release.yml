name: release

# Manual, deliberate releases only — never on every merge. You pick the moment;
# this cuts the -SNAPSHOT to a real version, publishes the libraries to Maven
# Central, tags it, then opens the next -SNAPSHOT on main.
#
# Central is the only publish target. Snapshots are not published anywhere —
# they stay local (`mvn install`); see the parent POM's maven.deploy.skip.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_GPG_PRIVATE_KEY   armored private key: gpg --armor --export-secret-keys <KEY_ID>
#   MAVEN_GPG_PASSPHRASE    that key's passphrase
#   CENTRAL_TOKEN_USERNAME  Central Portal user token — username half
#   CENTRAL_TOKEN_PASSWORD  Central Portal user token — password half
# See RELEASING.md. Without them the release fails at the Central upload.
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (blank = drop -SNAPSHOT from the current one)'
        required: false
        default: ''
      nextVersion:
        description: 'Next dev version incl. -SNAPSHOT (blank = bump patch)'
        required: false
        default: ''
      allowEmptyChangelog:
        description: 'Release even though CHANGELOG.md has nothing under [Unreleased]'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # push the version-bump commits and the tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Imports the signing key into the runner's keyring (and sets up the
          # gpg-agent for non-interactive use). Maven Central rejects unsigned
          # artifacts, so this is what makes the release publishable.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Passwords stay out of the file: ${env.*} is resolved by Maven at deploy
      # time from the step's env, so nothing secret is ever written to disk.
      - name: Write Maven settings for the Central upload
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <!-- id matches <publishingServerId> in the parent's release profile -->
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute versions
        id: v
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          RELEASE="${{ inputs.releaseVersion }}"
          [ -z "$RELEASE" ] && RELEASE="${CURRENT%-SNAPSHOT}"
          NEXT="${{ inputs.nextVersion }}"
          if [ -z "$NEXT" ]; then
            IFS='.' read -r MA MI PA <<< "$RELEASE"
            NEXT="${MA}.${MI}.$((PA + 1))-SNAPSHOT"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $RELEASE, then opening $NEXT"

      # Flat version scheme — every module shares the exact same version string,
      # in both <version> and <parent>. Replace the literal string across every
      # pom (the aggregator's parent isn't in the reactor versions:set would
      # touch, so a plain sed is complete and can't leave a mixed state).
      - name: Set release version
        run: find . -name pom.xml -exec sed -i "s|<version>${{ steps.v.outputs.current }}</version>|<version>${{ steps.v.outputs.release }}</version>|g" {} +

      # The core's package.json is the npm side of the same client and shares
      # the flat version. Nothing publishes it to a registry yet, but it is cut
      # from this commit, so it has to say so. `npm version` rather than sed:
      # it edits the one field and carries the lockfile along.
      - name: Set release version in the npm packages
        run: npm --prefix core/mc-semantic-ui-core version "${{ steps.v.outputs.release }}" --no-git-tag-version

      # Keep the copy-paste dependency snippets on the version people can
      # actually pull. Targets only a <version> that follows an mc-* artifactId,
      # so third-party versions (spring-boot, …) are untouched. Docusaurus can't
      # interpolate variables inside code fences, so this source rewrite is the way.
      #
      # README.md and doc/ are included deliberately: the README is the first
      # thing anyone copies from, and it drifted to a version that was never
      # released while only website/docs was being rewritten.
      - name: Update dependency snippets in the docs
        env:
          RELEASE: ${{ steps.v.outputs.release }}
        run: >
          find README.md doc website/docs \( -name '*.md' -o -name '*.mdx' \) -print0
          | xargs -0 perl -0777 -pi -e
          's|(<artifactId>mc-[^<]+</artifactId>\s*<version>)[^<]+(</version>)|${1}$ENV{RELEASE}${2}|g'

      # Before the upload, deliberately: an empty [Unreleased] means someone
      # forgot, and finding that out after a push to Central is too late —
      # a released version can never be taken back.
      - name: Freeze the changelog into this version
        env:
          RELEASE: ${{ steps.v.outputs.release }}
          ALLOW_EMPTY: ${{ inputs.allowEmptyChangelog }}
        run: |
          set -euo pipefail
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [Unreleased]' heading to release."
            exit 1
          fi
          # Everything between [Unreleased] and the next version heading.
          BODY=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && [ "$ALLOW_EMPTY" != "true" ]; then
            echo "::error::[Unreleased] is empty. Write what changed, or re-run with allowEmptyChangelog."
            exit 1
          fi
          printf '%s\n' "$BODY" > /tmp/release-notes.md
          sed -i "s|^## \[Unreleased\]$|## [$RELEASE] - $(date -u +%Y-%m-%d)|" CHANGELOG.md

      # The `release` profile adds the -sources/-javadoc jars and the GPG
      # signatures Central requires. Tests are skipped here — CI already ran
      # them on the commit being released.
      #
      # autoPublish is false, so the bundle lands in the portal as a validated
      # draft: it does not go live until you press Publish at
      # https://central.sonatype.com/publishing/deployments
      # A Central release can never be deleted, hence the deliberate manual gate.
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -DskipTests deploy -Prelease

      - name: Commit release version and tag
        run: |
          git commit -am "release: v${{ steps.v.outputs.release }}"
          git tag -a "v${{ steps.v.outputs.release }}" -m "Release v${{ steps.v.outputs.release }}"

      - name: Open next development version
        run: find . -name pom.xml -exec sed -i "s|<version>${{ steps.v.outputs.release }}</version>|<version>${{ steps.v.outputs.next }}</version>|g" {} +

      - name: Open next development version in the npm packages
        run: npm --prefix core/mc-semantic-ui-core version "${{ steps.v.outputs.next }}" --no-git-tag-version

      # In the same commit as the version bump, so main always has somewhere to
      # write the next entry — the moment it does not, people stop writing them.
      - name: Open a fresh Unreleased section
        env:
          RELEASE: ${{ steps.v.outputs.release }}
        run: |
          set -euo pipefail
          # index(), not a regex match: the heading contains [0.1.4], which as a
          # pattern is a character class and would never match the line it came
          # from — silently leaving main with nowhere to write the next entry.
          awk -v rel="## [$RELEASE]" '
            index($0, rel) == 1 && !done { print "## [Unreleased]"; print ""; done = 1 }
            { print }
          ' CHANGELOG.md > /tmp/changelog.md && mv /tmp/changelog.md CHANGELOG.md
          grep -q '^## \[Unreleased\]' CHANGELOG.md \
            || { echo "::error::failed to reopen [Unreleased]"; exit 1; }

      - name: Commit next version and push
        run: |
          git commit -am "chore: start ${{ steps.v.outputs.next }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }} --follow-tags

      # The changelog entry is the release note. Two sources would drift, and
      # the hand-written one is the one aimed at a reader deciding whether to
      # upgrade; --generate-notes is appended under it for the commit detail.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v${{ steps.v.outputs.release }}"
          --title "v${{ steps.v.outputs.release }}"
          --notes-file /tmp/release-notes.md
          --generate-notes
